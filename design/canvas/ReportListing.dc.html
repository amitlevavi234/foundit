<style>
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; } }

  .h3 { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.01em; line-height: 1.2; margin: 0; }

  .slab { background: #FFFFFF; border: 2px solid #1C1A24; border-radius: 18px; box-shadow: 6px 6px 0 #6E4BF6; transition: transform 180ms cubic-bezier(.34,1.56,.64,1), box-shadow 180ms cubic-bezier(.34,1.56,.64,1); }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; border: 2px solid #1C1A24; font-weight: 500; font-size: 15px; box-shadow: 3px 3px 0 #1C1A24; cursor: pointer; transition: transform 160ms cubic-bezier(.34,1.56,.64,1), box-shadow 160ms cubic-bezier(.34,1.56,.64,1), background 160ms; white-space: nowrap; }
  .pill:hover { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #1C1A24; background: #F1ECFF; }
  .pill:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #1C1A24; }
  .pill.on { background: #FF5A3C; color: #fff; } .pill.on:hover { background: #FF5A3C; }
  .pill.soft { border-style: dashed; box-shadow: none; background: #F1ECFF; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 14px; border: 2px solid #1C1A24; background: #FFFFFF; font-weight: 600; font-size: 16px; cursor: pointer; box-shadow: 4px 4px 0 #1C1A24; white-space: nowrap; transition: transform 160ms cubic-bezier(.34,1.56,.64,1), box-shadow 160ms cubic-bezier(.34,1.56,.64,1); }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1C1A24; } .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #1C1A24; }
  .btn-coral { background: #FF5A3C; color: #fff; } .btn-violet { background: #6E4BF6; color: #fff; } .btn-lime { background: #B8F04A; }

  .btn-sm { height: 42px; padding: 0 16px; font-size: 15px; border-radius: 12px; } .btn-xs { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; box-shadow: 3px 3px 0 #1C1A24; }

  .toggle.on { background: #B8F04A; } .toggle.on::after { transform: translateX(20px); }
  /* motion */
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drop { 0% { transform: translateY(-46px) rotate(-6deg); opacity: 0; } 22% { opacity: 1; } 60% { transform: translateY(0) rotate(0); } 100% { transform: translateY(0); opacity: 1; } }
  @keyframes shimmer { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
  @keyframes meter { from { width: 0; } to { width: var(--w); } }
  @keyframes meterbadge { from { left: 0; } to { left: var(--w); } }
  @keyframes caret { 50% { opacity: 0; } }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @property --n { syntax: '<integer>'; initial-value: 0; inherits: false; }
  @keyframes countup { from { --n: 0; } to { --n: var(--t); } }
  .count { counter-reset: n var(--n); animation: countup 900ms cubic-bezier(.16,1,.3,1) 300ms both; } .count::after { content: counter(n); }
  .rise { animation: rise 420ms cubic-bezier(.34,1.56,.64,1) both; }
  .hl { position: relative; display: inline-block; }
  .hl::before { content: ''; position: absolute; inset: 12% -2% 6% -2%; background: #FF5A3C; z-index: -1; transform-origin: left; animation: sweep 520ms cubic-bezier(.16,1,.3,1) 600ms both; border-radius: 6px; }
  .meter { position: relative; height: 14px; border-radius: 999px; background: #EFEBE2; border: 2px solid #1C1A24; }
  .meter > .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #6E4BF6, #FF5A3C 60%, #B8F04A); animation: meter 780ms cubic-bezier(.16,1,.3,1) 250ms both; overflow: hidden; }
  .meter > .fill::after { content: ''; position: absolute; top: 0; bottom: 0; width: 30%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: shimmer 1.2s ease-out 1.05s both; }
  .badge { position: absolute; top: 50%; left: var(--w); transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; border: 2px solid #1C1A24; background: #FFFFFF; box-shadow: 3px 3px 0 #1C1A24; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; animation: meterbadge 780ms cubic-bezier(.16,1,.3,1) 250ms both, countup 900ms cubic-bezier(.16,1,.3,1) 300ms both; }
  .like:hover svg { animation: pop 320ms cubic-bezier(.34,1.56,.64,1); }
  .like.on { color: #FF5A3C; } .like.on svg { fill: #FF5A3C; stroke: #FF5A3C; }
