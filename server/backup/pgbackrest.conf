# ===========================================================================
# pgBackRest — Foundit
#
# research/08 §5.3, with the repository pointed at Cloudflare R2. This file is
# a TEMPLATE: it is copied to /srv/foundit/conf/pgbackrest.conf in 9b
# (docs/launch-runbook.md step 2a) and the four REPLACE_ values are filled in
# there, by the owner, on the host.
#
# IT IS THE ONE PLACE IN THIS PROJECT WHERE A CREDENTIAL LIVES IN A CONFIG FILE
# RATHER THAN IN AN ENVIRONMENT, and that is pgBackRest's design rather than a
# choice made here: `repo1-s3-key`, `repo1-s3-key-secret` and
# `repo1-cipher-pass` are read from this file. What protects them is the mode:
#
#   sudo chown 999:999 /srv/foundit/conf/pgbackrest.conf
#   sudo chmod 0640    /srv/foundit/conf/pgbackrest.conf
#
# research/08 §5.2's argument for pgBackRest over WAL-G is precisely that a
# file somebody can read a year later beats a dozen environment variables set
# somewhere nobody remembers. The trade is that the file has to be guarded.
#
# THE COPY IN THIS REPOSITORY HAS NO VALUES IN IT and scripts/scan-secrets.sh
# scans it on every commit.
#
# TWO BACKUPS, NOT ONE, AND THEY FAIL DIFFERENTLY. This is the physical one:
# base backups plus continuous WAL archiving, which is what makes
# point-in-time recovery possible. server/backup/pg-dump-offsite.sh is the
# logical one — a plain pg_dump, through a different tool and a different code
# path, encrypted with a different key — so that one tool's failure cannot take
# both. Two backups that fail the same way are one backup.
# ===========================================================================

[global]

# --- Repository 1: Cloudflare R2 -------------------------------------------
# R2 speaks the S3 API. Its region is the literal string `auto` and it wants
# path-style URIs; both are R2 facts rather than preferences.
repo1-type=s3
repo1-path=/foundit
repo1-s3-bucket=foundit-pgbackrest
repo1-s3-endpoint=REPLACE_ACCOUNT_ID.r2.cloudflarestorage.com
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-s3-key=REPLACE_R2_ACCESS_KEY_ID
repo1-s3-key-secret=REPLACE_R2_SECRET_ACCESS_KEY
repo1-storage-verify-tls=y

# --- Encryption, client-side, BEFORE upload --------------------------------
#
# LOSE THIS PASSPHRASE AND THE REPOSITORY IS CRYPTOGRAPHICALLY WORTHLESS. There
# is no recovery path and no support line. Generate it on the host with
#
#     openssl rand -base64 48 | tr -d '\n'
#
# and put it in the password manager AND on paper, off this server.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=REPLACE_WITH_THE_48_BYTE_PASSPHRASE

# --- Retention --------------------------------------------------------------
# Four weekly fulls and a week of differentials: about 28 days of recoverable
# history.
repo1-retention-full-type=count
repo1-retention-full=4
repo1-retention-diff=7
# `repo1-retention-archive` IS DELIBERATELY UNSET. pgBackRest then keeps WAL
# for as long as the full backup it belongs to, which is what makes
# point-in-time recovery work across the whole retention window rather than
# only since the newest full. Setting it is the commonest way to have 28 days
# of backups and 2 days of PITR without noticing.

# --- Compression and parallelism -------------------------------------------
# process-max=2 for a CX23's two vCPUs. Four on a bigger box, and no more than
# there are cores: this runs beside PostgreSQL and the application.
compress-type=zst
compress-level=6
process-max=2

# --- Behaviour --------------------------------------------------------------
# `start-fast` takes an immediate checkpoint instead of waiting up to
# checkpoint_timeout — fifteen minutes here — before the backup begins.
start-fast=y
# `archive-async` pushes WAL through a spool directory, so a slow or failing
# network never stalls a COMMIT. On a 40 GB disk this is what keeps a bad
# afternoon from becoming a PANIC shutdown.
archive-async=y
spool-path=/var/spool/pgbackrest
archive-timeout=60
buffer-size=4MiB
delta=y

# --- Logging ----------------------------------------------------------------
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
log-timestamp=y

# --- WAL pushes are constant; trade ratio for CPU --------------------------
[global:archive-push]
compress-level=3

# --- The stanza -------------------------------------------------------------
# `pg1-path` is the data directory AS THE CONTAINER SEES IT, which is what
# `server/setup/09-postgres-service.sh` bind-mounts /srv/foundit/data to.
[foundit]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-database=foundit
