# A throwaway PostgreSQL for working on your own machine.
#
# Start it:   docker compose -f db/docker-compose.dev.yml up -d
# Stop it:    docker compose -f db/docker-compose.dev.yml down
#
# The data lives in ./db/.data, a plain folder on disk rather than a Docker
# named volume. That is deliberate: `docker compose down -v` deletes named
# volumes permanently, and it is a command people run casually.
#
# FIVE ROLES LIVE IN HERE, and the differences between them are the point:
#
#   postgres       the cluster's superuser, and the ONLY superuser. It exists
#                  to initialise the cluster and to do the two jobs a
#                  non-superuser cannot: create the `vector` extension, which
#                  is not a trusted extension, and load db/seed/dev_seed.sql
#                  past FORCE ROW LEVEL SECURITY. Nothing else ever connects
#                  as it — not the application, not the tests, not a
#                  migration.
#   foundit_owner  owns the schemas and runs migrations. **NOSUPERUSER,
#                  NOBYPASSRLS**, matching research/08 §9.3 and the server it
#                  will run on. That is a change made on 13 September 2026 and
#                  the Phase 8 review is why: `public.record_tool_open` moved
#                  no counter at all on a database whose owner is not a
#                  superuser, and the suite could not see it because the suite
#                  ran as one. `public.tools` is FORCE ROW LEVEL SECURITY, so
#                  the owner is subject to the same policies as everybody
#                  else, and now it is subject to them HERE as well as on the
#                  server.
#   foundit_app    what the application, the eval harness and the tests
#                  connect as. Owns nothing, no superuser, no BYPASSRLS. It
#                  gets its grants from db/migrations/0001_init.sql and
#                  0002_search.sql and nothing else — this file only gives it
#                  a password so it can log in at all.
#   foundit_embed  what scripts/embed.mjs connects as, and nothing else. Two
#                  function grants, no table grant, no search. It exists
#                  because the role that can WRITE a vector onto a problem
#                  statement must not be the role that can ask which vector is
#                  nearest a cached query: together those two read the query
#                  cache out one sign bit at a time. See 0005_embed_role.sql.
#   foundit_auth   what Better Auth connects as, and nothing else. The five
#                  tables in auth_core and no object in any other schema. It
#                  exists so that an application bug and an authentication bug
#                  are two incidents rather than one: foundit_app holds nothing
#                  in auth_core and this role holds nothing in public. See
#                  0013_accounts.sql.
#
# WHY POSTGRES_USER IS `postgres` AND NOT `foundit_owner`. PostgreSQL refuses
# to take SUPERUSER away from the role initdb bootstrapped with —
# "the bootstrap superuser must have the SUPERUSER attribute" — so a container
# initialised as foundit_owner can never have a non-superuser owner, whatever
# is written afterwards. The bootstrap role therefore has to be somebody else.
#
# foundit_owner keeps the password it has always had, so DATABASE_URL_OWNER in
# an existing .env.local is unchanged by any of this; what changed is the two
# attributes the role no longer carries.
#
# All five passwords are throwaway literals on purpose, and that is the only kind
# of password that ever belongs in a tracked file: this database holds
# invented seed data, listens on 127.0.0.1 only, and can be deleted at any
# time. The server's credentials are generated on the server and live in a
# root-only file there. See docs/development.md.
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: foundit-dev-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: foundit
    ports:
      # Bound to localhost, never 0.0.0.0. On this laptop it hardly matters;
      # the habit is what matters, because on the server it decides whether
      # the database is on the public internet.
      - "127.0.0.1:5433:5432"
    volumes:
      - ./.data:/var/lib/postgresql/data
      # db/dev-roles.sql, run ONCE by the entrypoint on an empty ./db/.data,
      # as the `postgres` superuser, before any migration. It is a mounted
      # file rather than an inline `configs:` block because Docker Compose
      # interpolates `$` in config content: `do $$ ... $$` reached PostgreSQL
      # as `do $ ... $` and the container refused to start.
      - ./dev-roles.sql:/docker-entrypoint-initdb.d/10-dev-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foundit"]
      interval: 5s
      timeout: 5s
      retries: 10
